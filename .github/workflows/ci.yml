name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi python3-yaml gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            gir1.2-gtksource-4 gir1.2-notify-0.7 gir1.2-ayatanaappindicator3-0.1

      - name: Compile
        run: python3 -m compileall -q stackyard

      - name: Check translations
        run: python3 packaging/check_translations.py

      - name: Test generated scripts
        run: python3 packaging/test_scripts.py

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: stackyard-deb
          path: dist/*.deb

  clean-install:
    needs: test-and-build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stackyard-deb
          path: dist
      - name: Install the package on a clean Ubuntu and start the app
        run: bash packaging/ci/smoke-test.sh dist/*.deb
